
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registrar incidencia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="formulario">
    <h2>Reportar un problema</h2>
    <p>Describe lo ocurrido y adjunta una fotografía.</p>

    <ion-item>
      <ion-input
        label="Título"
        labelPlacement="stacked"
        placeholder="Ej. Luminaria dañada"
        [(ngModel)]="titulo"
        maxlength="100">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Descripción"
        labelPlacement="stacked"
        placeholder="Describe el problema..."
        [(ngModel)]="descripcion"
        rows="4"
        maxlength="1000">
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-select
        label="Categoría"
        labelPlacement="stacked"
        placeholder="Selecciona una categoría"
        [(ngModel)]="categoria">
        <ion-select-option value="Alumbrado">Alumbrado público</ion-select-option>
        <ion-select-option value="Vías">Vías y aceras</ion-select-option>
        <ion-select-option value="Basura">Basura y limpieza</ion-select-option>
        <ion-select-option value="Agua">Agua y alcantarillado</ion-select-option>
        <ion-select-option value="Espacios públicos">Espacios públicos</ion-select-option>
        <ion-select-option value="Otro">Otro</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input
        label="Ubicación"
        labelPlacement="stacked"
        placeholder="Calle, sector o referencia"
        [(ngModel)]="ubicacion">
      </ion-input>
    </ion-item>

    <ion-button expand="block" fill="outline" type="button" (click)="usarMiUbicacion()">
      <ion-icon name="locate-outline" slot="start"></ion-icon>
      Usar mi ubicación actual
    </ion-button>

    <div class="fotografia">
      <h3>Fotografía de la incidencia</h3>

      <input
        type="file"
        accept="image/*"
        capture="environment"
        (change)="onArchivoSeleccionado($event)">

      <img
        *ngIf="vistaPrevia"
        [src]="vistaPrevia"
        alt="Vista previa de la fotografía"
        class="vista-previa">
    </div>

    <ion-button
      expand="block"
      class="boton-registrar"
      [disabled]="guardando"
      (click)="registrarIncidencia()">
      <ion-spinner
        *ngIf="guardando"
        name="crescent">
      </ion-spinner>

      <span *ngIf="!guardando">Registrar incidencia</span>
      <span *ngIf="guardando">Guardando...</span>
    </ion-button>
  </div>
</ion-content>
